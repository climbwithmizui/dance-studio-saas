<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eaf1fb" />
  <title>{% block title %}ヘルプ{% endblock %} — Dance Studio</title>
  <style>
    :root {
      --blue: #3f7fe0;
      --blue-soft: #eaf3ff;
      --ink: #2a3441;
      --muted: #6f7c8d;
      --line: rgba(101, 135, 177, .22);
      --warning: #8a5a13;
      --warning-bg: #fff8e8;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; padding: 24px 14px 48px;
      font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink); line-height: 1.8;
      background:
        radial-gradient(900px 500px at 90% -10%, #fff 0%, transparent 62%),
        linear-gradient(160deg, #fbfdff 0%, #eef3fa 48%, #e5edf8 100%);
      min-height: 100vh;
    }
    .shell { width: min(760px, 100%); margin: 0 auto; }
    .top-nav {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    }
    .top-nav a, .button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 42px; padding: 9px 14px; border-radius: 12px;
      color: var(--blue); background: rgba(255,255,255,.8);
      border: 1px solid var(--line); text-decoration: none; font-weight: 700;
      font-size: 13px;
    }
    .card {
      background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.9);
      border-radius: 22px; padding: clamp(22px, 5vw, 42px);
      box-shadow: 0 20px 55px -24px rgba(55, 94, 145, .5);
    }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    h1 { font-size: clamp(24px, 5vw, 34px); line-height: 1.35; margin: 6px 0 8px; }
    .lead { margin: 0 0 26px; color: var(--muted); }
    h2 {
      font-size: 20px; margin: 38px 0 14px; padding-bottom: 8px;
      border-bottom: 2px solid var(--blue-soft);
    }
    h3 { font-size: 16px; margin: 24px 0 8px; }
    p { margin: 8px 0 14px; }
    ul, ol { padding-left: 1.45em; }
    li + li { margin-top: 7px; }
    .steps { list-style: none; padding: 0; counter-reset: step; }
    .steps > li {
      counter-increment: step; position: relative; padding: 18px 18px 18px 62px;
      background: #f8fbff; border: 1px solid var(--line); border-radius: 15px;
      margin: 12px 0;
    }
    .steps > li::before {
      content: counter(step); position: absolute; left: 17px; top: 17px;
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      background: var(--blue); color: white; font-weight: 900;
    }
    .steps strong { display: block; margin-bottom: 4px; }
    .callout {
      border-left: 4px solid var(--blue); background: var(--blue-soft);
      padding: 14px 16px; border-radius: 4px 12px 12px 4px; margin: 18px 0;
    }
    .callout.warning { border-color: #d39a35; background: var(--warning-bg); color: var(--warning); }
    .button.primary { color: white; background: var(--blue); border-color: var(--blue); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .table-wrap { overflow-x: auto; margin: 14px 0; }
    table { width: 100%; border-collapse: collapse; min-width: 570px; font-size: 14px; }
    th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #f1f6fd; }
    code { background: #eef3fa; padding: 2px 6px; border-radius: 6px; font-size: .92em; }
    .toc {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px; padding: 0; list-style: none;
    }
    .toc a { display: block; padding: 10px 12px; color: var(--blue); background: #f7faff; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 13px; }
    footer { color: #8a96a6; text-align: center; font-size: 11px; margin-top: 20px; }
    @media (max-width: 520px) {
      body { padding: 14px 10px 36px; }
      .card { border-radius: 17px; }
      .top-nav a { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top-nav" aria-label="ヘルプメニュー">
      <a href="{{ url_for('index') }}">Dance Studio</a>
      <a href="{{ url_for('guide') }}">使い方ガイド</a>
      <a href="{{ url_for('evolink_api_key_guide') }}">APIキー取得</a>
      <a href="{{ url_for('terms') }}">利用規約</a>
      <a href="{{ url_for('privacy') }}">プライバシー</a>
      <a href="{{ url_for('tokushoho') }}">特商法表記</a>
    </nav>
    <article class="card">
      {% block content %}{% endblock %}
    </article>
    <footer>CLIMB with MIZUI © 2026</footer>
  </main>
</body>
</html>
