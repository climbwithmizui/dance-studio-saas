<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン — Dance Studio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: linear-gradient(160deg, #fbfdff 0%, #eef3fa 45%, #e4ecf7 100%);
      min-height: 100vh; margin: 0;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 360px; background: #fff; padding: 28px 24px;
      border-radius: 18px; box-shadow: 0 18px 50px -18px rgba(70,110,170,.45);
    }
    h1 { font-size: 20px; margin: 0 0 6px; color: #2a3441; text-align: center; }
    p.sub { text-align: center; color: #7b8797; font-size: 13px; margin: 0 0 20px; }
    label { display: block; font-size: 12.5px; font-weight: 700; color: #2a3441; margin: 14px 0 6px; }
    input {
      width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 15px;
      border: 1px solid rgba(120,150,190,.3); border-radius: 12px;
    }
    button {
      width: 100%; margin-top: 22px; padding: 14px; font-size: 16px; font-weight: 700;
      color: #fff; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, #7cb4fb, #4f8ff2);
    }
    .err { background: #fdecef; color: #d6455d; font-size: 13px; padding: 10px 12px;
      border-radius: 10px; margin-bottom: 8px; text-align: center; }
    .foot { text-align: center; margin-top: 18px; font-size: 13px; color: #7b8797; }
    .foot a { color: #3f7fe0; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dance Studio</h1>
    <p class="sub">ログイン</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required autocomplete="email" />
      <label for="password">パスワード</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />
      <button type="submit">ログイン</button>
    </form>
    <p class="foot">アカウントをお持ちでない方は <a href="{{ url_for('signup') }}">新規登録</a></p>
    <p class="foot"><a href="{{ url_for('tokushoho') }}">特定商取引法に基づく表記</a></p>
  </div>
</body>
</html>
